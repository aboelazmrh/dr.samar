<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة د. سمر</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="/">د. سمر<span>لوحة متابعة الاستمارات</span></a><button id="logout" class="secondary" hidden>تسجيل الخروج</button></header><main><section class="form-card"><form id="login"><h2>دخول الدكتورة</h2><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" style="margin-top:20px">دخول</button></form><p id="status" role="status"></p><div id="results" hidden><h2>الاستمارات المستلمة</h2><button id="refresh" class="secondary">تحديث</button><div id="list"></div></div></section></main><script>
const $=id=>document.getElementById(id);const labels={accepted:'الإشعار قُبل لدى خدمة واتساب؛ التسليم غير مؤكد',failed:'تعذر إرسال إشعار واتساب',not_configured:'إشعار واتساب غير مفعّل',pending:'الإشعار قيد المعالجة'};
async function load(){try{const r=await fetch('/api/submissions');if(r.status===401){$('login').hidden=false;$('results').hidden=true;$('logout').hidden=true;return}if(!r.ok)throw Error('تعذر تحميل البيانات');const d=await r.json();$('login').hidden=true;$('results').hidden=false;$('logout').hidden=false;$('list').replaceChildren();$('status').textContent=d.submissions.length?'':'لا توجد استمارات بعد';for(const s of d.submissions){const box=document.createElement('details');box.id=s.id;const head=document.createElement('summary');head.textContent=s.answers[0].value+' · '+new Date(s.created*1000).toLocaleString('ar-EG');box.append(head);const note=document.createElement('p');note.textContent=labels[s.notification]||s.notification;box.append(note);const dl=document.createElement('dl');for(const a of s.answers){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=a.title;dd.textContent=a.value;dl.append(dt,dd)}box.append(dl);box.style.marginTop='24px';$('list').append(box);if(location.hash.slice(1)===s.id){box.open=true;box.scrollIntoView()}}}catch(e){$('status').textContent=e.message}}
$('login').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error);$('password').value='';$('status').textContent='';await load()}catch(e){$('status').textContent=e.message}};$('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});$('list').replaceChildren();await load()};$('refresh').onclick=load;load();
</script></body></html>
